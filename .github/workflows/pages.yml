name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  # Queue deployments instead of cancelling one while Pages is publishing it.
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Configure Pages
        uses: actions/configure-pages@v6
      # Pages artifacts are immutable: a rerun must reuse the first upload, not create a duplicate.
      - name: Upload site artifact
        if: ${{ github.run_attempt == 1 }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
      # deploy-pages reads from the Actions Results service, whose index can lag behind
      # the REST artifact list. Allow up to 60 seconds for that index before the first lookup.
      - name: Wait for Pages artifact indexing
        if: ${{ github.run_attempt == 1 }}
        run: sleep 60
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
