name: Validate and deploy GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  # Queue deployments instead of cancelling one while Pages is publishing it.
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install Python and Node dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install ruff
          npm ci
      - name: Check formatting and lint Python scripts
        run: |
          .venv/bin/ruff format --check scripts/check_site.py scripts/build_site.py
          .venv/bin/ruff check scripts/check_site.py scripts/build_site.py
          npx prettier --check .github/workflows/pages.yml README.md package.json package-lock.json playwright.config.js tests/accessibility.spec.js tests/responsive.spec.js styles.css app.js deck-data.js globe.js quest.html
      - name: Validate markup and local assets
        run: python3 scripts/check_site.py
      - name: Validate JavaScript syntax
        run: node --check app.js && node --check deck-data.js && node --check globe.js
      - name: Install Chromium for responsive tests
        run: npx playwright install --with-deps chromium
      - name: Run responsive desktop, tablet, and mobile browser tests
        run: npm run test:e2e
      - name: Build minimal site artifact
        run: python3 scripts/build_site.py

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Build minimal site artifact
        run: python3 scripts/build_site.py
      # Pages artifacts are immutable; on reruns reuse the original artifact.
      - name: Upload site artifact
        if: ${{ github.run_attempt == 1 }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      # deploy-pages reads the Actions Results service, whose index can lag behind upload.
      - name: Wait for Pages artifact indexing
        if: ${{ github.run_attempt == 1 }}
        run: sleep 60
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
